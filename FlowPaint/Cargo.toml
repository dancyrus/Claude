[package]
name = "flowpaint"
version = "0.1.0"
edition = "2021"
description = "A CFD paint program: draw geometry, place fans and drains, watch real fluid dynamics on your GPU"
license = "MIT"

[dependencies]
eframe = { version = "0.29", features = ["wgpu"] }
egui = "0.29"
egui-wgpu = "0.29"
wgpu = "22"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
naga = { version = "22", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
lto = "thin"
