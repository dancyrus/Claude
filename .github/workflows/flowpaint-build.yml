name: FlowPaint builds

on:
  push:
    branches: ["**"]
    paths:
      - "FlowPaint/**"
      - ".github/workflows/flowpaint-build.yml"
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: FlowPaint-windows-x64
            binary: target/release/flowpaint.exe
          - name: Linux x64
            os: ubuntu-latest
            artifact: FlowPaint-linux-x64
            binary: target/release/flowpaint
          - name: macOS arm64
            os: macos-latest
            artifact: FlowPaint-macos-arm64
            binary: target/release/flowpaint
    defaults:
      run:
        working-directory: FlowPaint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: FlowPaint
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Test (shader validation)
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: FlowPaint/${{ matrix.binary }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip artifacts
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
